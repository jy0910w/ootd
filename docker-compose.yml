services:
  # 資料庫服務：儲存使用者、穿搭、衣櫥資料
  db:
    image: postgres:15-alpine
    container_name: ootd-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: your_secure_password # 建議正式部署時改用環境變數
      POSTGRES_DB: ootd_platform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 資料庫管理工具：讓你透過瀏覽器查看資料表
  pgadmin:
    image: dpage/pgadmin4
    container_name: ootd-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8080:80"
    depends_on:
      - db

  # 你的 .NET API 容器佔位符
  api:
    build:
      context: ./apps/api
    container_name: ootd-api
    ports:
      - "5050:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=db;Database=ootd_platform;Username=admin;Password=your_secure_password
      - Gemini__ApiKey=${GEMINI_API_KEY}
      - Gemini__ModelName=${GEMINI_MODEL_NAME:-gemini-2.5-flash}
    depends_on:
      - db

volumes:
  postgres_data:
